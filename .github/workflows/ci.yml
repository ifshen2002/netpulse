name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Code Quality (Lint) ─────────────────────────────────────────────
  lint:
    name: Code Quality (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint backend
        working-directory: backend
        run: |
          flake8 . \
            --max-line-length=320 \
            --extend-exclude=alembic/versions \
            --count \
            --statistics

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  # ── Unit Tests (UT) ─────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (UT)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/unit/ -v --no-cov --junitxml=test-results-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/test-results-unit.xml

  # ── Frontend Build ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ── Integration Tests (IT) ──────────────────────────────────────────
  integration-tests:
    name: Integration Tests (IT)
    needs: [lint]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpulse
          POSTGRES_PASSWORD: netpulse
          POSTGRES_DB: netpulse
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
        run: alembic upgrade head

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
          REDIS_URL: redis://localhost:6379/0
          NETPULSE_TESTING: "1"
        run: pytest tests/integration/ -v --cov-report=xml --junitxml=test-results-integration.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/htmlcov/
            backend/coverage.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/test-results-integration.xml

  # ── Deployment Validation ────────────────────────────────────────────
  deployment-validation:
    name: Deployment Validation
    needs: [integration-tests]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpulse
          POSTGRES_PASSWORD: netpulse
          POSTGRES_DB: netpulse
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
        run: alembic upgrade head

      - name: Start server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
          REDIS_URL: redis://localhost:6379/0
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/api/health && break
            sleep 1
          done
          curl -s http://localhost:8000/api/health || exit 1

      - name: Container inspection
        if: always()
        run: |
          echo "=== docker ps ===" > container-inspection.txt
          docker ps -a >> container-inspection.txt 2>&1 || true
          echo "" >> container-inspection.txt
          echo "=== docker images ===" >> container-inspection.txt
          docker images >> container-inspection.txt 2>&1 || true
          echo "" >> container-inspection.txt
          echo "=== docker stats (one-shot) ===" >> container-inspection.txt
          docker stats --no-stream >> container-inspection.txt 2>&1 || true
          echo "" >> container-inspection.txt
          echo "=== docker inspect netpulse-backend-1 ===" >> container-inspection.txt
          docker inspect $(docker ps -aq --filter name=netpulse-backend-1 --filter name=netpulse 2>/dev/null | head -1) >> container-inspection.txt 2>&1 || true

      - name: Container logs (last 100 lines)
        if: always()
        run: |
          BACKEND_CID=$(docker ps -aq --filter name=backend 2>/dev/null | head -1)
          if [ -n "$BACKEND_CID" ]; then
            echo "=== docker logs $BACKEND_CID (tail 100) ===" > container-logs.txt
            docker logs --tail 100 $BACKEND_CID >> container-logs.txt 2>&1 || true
          else
            echo "No backend container running" > container-logs.txt
          fi

      - name: Upload container artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-inspection
          path: |
            container-inspection.txt
            container-logs.txt

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then
            kill $(cat /tmp/uvicorn.pid) 2>/dev/null || true
          fi

  # ── Docker Validation ────────────────────────────────────────────────
  docker-validation:
    name: Docker Validation
    needs: [unit-tests, integration-tests, deployment-validation, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config

      - name: Build backend image
        run: docker build ./backend

  # ── Load & Stress Testing ───────────────────────────────────────────
  load-testing:
    name: Load & Stress Testing
    needs: [deployment-validation]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpulse
          POSTGRES_PASSWORD: netpulse
          POSTGRES_DB: netpulse
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
          REDIS_URL: redis://localhost:6379/0
          NETPULSE_TESTING: "1"
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn-load.log 2>&1 &
          echo $! > /tmp/uvicorn-load.pid
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/api/health && break
            sleep 1
          done
          curl -s http://localhost:8000/api/health || (cat /tmp/uvicorn-load.log; exit 1)

      - name: Run load test (10 concurrent users, 30s)
        working-directory: backend
        env:
          LOAD_TEST_BASE_URL: http://localhost:8000
          LOAD_TEST_CONCURRENT_USERS: "10"
          LOAD_TEST_DURATION_S: "30"
        run: python tests/load/test_load.py

      - name: Run stress test (50 concurrent users, 20s)
        working-directory: backend
        env:
          LOAD_TEST_BASE_URL: http://localhost:8000
          LOAD_TEST_CONCURRENT_USERS: "50"
          LOAD_TEST_DURATION_S: "20"
        run: python tests/load/test_load.py

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            backend/tests/load/load-report.json

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/uvicorn-load.pid ]; then
            kill $(cat /tmp/uvicorn-load.pid) 2>/dev/null || true
          fi

  # ── SAST (Bandit) ────────────────────────────────────────────────────
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        working-directory: backend
        run: |
          bandit -r . \
            -x alembic/versions,tests \
            --severity-level medium \
            --format json \
            --output bandit-report.json || true
          bandit -r . \
            -x alembic/versions,tests \
            --severity-level medium || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # ── Container Scan (Trivy) ───────────────────────────────────────────
  container-scan:
    name: Container Scan (Trivy)
    needs: [docker-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t netpulse-backend ./backend

      - name: Save Docker image
        run: |
          mkdir -p docker-images
          docker save netpulse-backend:latest -o docker-images/netpulse-backend.tar
          echo "Image saved: $(du -h docker-images/netpulse-backend.tar | cut -f1)"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-backend
          path: docker-images/netpulse-backend.tar
          retention-days: 7

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: netpulse-backend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          output: trivy-report.txt

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: netpulse-backend
          format: json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          output: trivy-report.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-report.json

  # ── DAST (OWASP ZAP) ─────────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    needs: [container-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d postgres redis
          for i in $(seq 1 30); do
            docker compose exec postgres pg_isready -U netpulse && break
            sleep 1
          done
          docker compose exec postgres pg_isready -U netpulse || exit 1

      - name: Build and start backend
        run: |
          docker compose build backend
          docker compose up -d backend
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/api/health && break
            sleep 1
          done
          curl -s http://localhost:8000/api/health || exit 1

      - name: ZAP Baseline Scan
        run: |
          docker run --rm --network host \
            -v "$(pwd)":/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -I \
            -r /zap/wrk/zap-report.html \
            -w /zap/wrk/zap-report.md \
            -J /zap/wrk/zap-report.json

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.md
            zap-report.json

      - name: Stop services
        if: always()
        run: docker compose down -v
