services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netpulse}
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-netpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-netpulse}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-netpulse}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://netpulse:netpulse@postgres:5432/netpulse}
      REDIS_URL: ${REDIS_URL:-redis://:netpulse@redis:6379/0}
      NETPULSE_ADMIN_EMAIL: ${NETPULSE_ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-netpulse}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # Sleep until 02:00 UTC
          sleep 3600
          NOW=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h postgres -U ${POSTGRES_USER:-netpulse} -Fc ${POSTGRES_DB:-netpulse} > /backups/netpulse_$${NOW}.dump 2>/dev/null
          # Keep only last 7 daily backups
          find /backups -name 'netpulse_*.dump' -mtime +7 -delete 2>/dev/null
        done

volumes:
  pgdata:
  frontend_dist:
